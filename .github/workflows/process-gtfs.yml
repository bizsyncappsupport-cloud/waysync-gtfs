name: Process GTFS

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download and process GTFS
        run: |
          python process_gtfs.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-processed
          path: stops_sample.json
